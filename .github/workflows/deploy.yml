name: Deploy to SFTP

on:
    push:
        branches:
            - main
            - test

jobs:
    deploy-production:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Deploy pages via SFTP
              uses: wlixcc/SFTP-Deploy-Action@v1.2.4
              with:
                  server: ${{ secrets.SFTP_HOST }}
                  username: ${{ secrets.SFTP_USER }}
                  password: ${{ secrets.SFTP_PASSWORD }}
                  port: ${{ secrets.SFTP_PORT }}
                  local_path: "./public/*"
                  remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
                  sftp_only: true

    deploy-test:
        if: github.ref == 'refs/heads/test'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Build test basic auth files
              run: |
                  if [ -z "${{ secrets.TEST_BASIC_AUTH_USER }}" ] || [ -z "${{ secrets.TEST_BASIC_AUTH_PASSWORD }}" ]; then
                    echo "Missing TEST_BASIC_AUTH_USER or TEST_BASIC_AUTH_PASSWORD secret." >&2
                    exit 1
                  fi

                  AUTH_B64="$(printf '%s:%s' "${{ secrets.TEST_BASIC_AUTH_USER }}" "${{ secrets.TEST_BASIC_AUTH_PASSWORD }}" | base64 | tr -d '\n')"

                  cat > public/.htaccess <<EOF
                  RewriteEngine On
                  RewriteCond %{HTTP:Authorization} !^Basic[[:space:]]+${AUTH_B64}$ [NC]
                  RewriteRule ^ - [E=NEED_AUTH:1]
                  Header always set WWW-Authenticate "Basic realm=\"Testbereich Ruestzeithaus Salza\"" env=NEED_AUTH
                  RewriteCond %{ENV:NEED_AUTH} =1
                  RewriteRule ^ - [R=401,L]
                  <Files ".ht*">
                      Require all denied
                  </Files>
                  EOF

            - name: Deploy test pages via SFTP
              uses: wlixcc/SFTP-Deploy-Action@v1.2.4
              with:
                  server: ${{ secrets.SFTP_HOST }}
                  username: ${{ secrets.SFTP_TEST_USER }}
                  password: ${{ secrets.SFTP_TEST_PASSWORD }}
                  port: ${{ secrets.SFTP_PORT }}
                  local_path: "./public/*"
                  remote_path: ${{ secrets.SFTP_TEST_REMOTE_PATH }}
                  sftp_only: true

            - name: Deploy test .htaccess via SFTP
              uses: wlixcc/SFTP-Deploy-Action@v1.2.4
              with:
                  server: ${{ secrets.SFTP_HOST }}
                  username: ${{ secrets.SFTP_TEST_USER }}
                  password: ${{ secrets.SFTP_TEST_PASSWORD }}
                  port: ${{ secrets.SFTP_PORT }}
                  local_path: "./public/.htaccess"
                  remote_path: ${{ secrets.SFTP_TEST_REMOTE_PATH }}
                  sftp_only: true
